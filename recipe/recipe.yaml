context:
  version: "1.0.2"

package:
  name: edcal
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/edcal/edcal-${{ version }}.tar.gz
  sha256: e8ad85e86e1af6250bb2bb0a45dc2f594d3704a192ce181b6ca2fb95f8251617

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - edcal = edcal.main:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
    - wheel
  run:
    - python >=${{ python_min }}
    - algodif >=1.1.0
    - numpy
    - scipy
    - h5py
    - joblib
    - pyside6
    - pyqtgraph

tests:
  - python:
      imports:
        - edcal
        - edcal.lib.utilities
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/algodif/edcal
  license: Apache-2.0
  license_file: LICENSE
  summary: GUI software for energy and q calibration of energy-dispersive X-ray detectors, built on Algodif

extra:
  recipe-maintainers:
    - nghia-vo
